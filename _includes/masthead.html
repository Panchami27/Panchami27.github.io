{% include base_path %}
<header class="portfolio-header">
  <div class="portfolio-header-inner">
    <a class="portfolio-brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">PP</span>{{ site.title }}</a>
    <nav class="desktop-navigation" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
    <details class="mobile-navigation">
      <summary>Menu</summary>
      <nav aria-label="Mobile navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
        {% endfor %}
      </nav>
    </details>
    <span id="theme-toggle"><button type="button" class="theme-switch" aria-label="Toggle light and dark theme"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></button></span>
  </div>
</header>
